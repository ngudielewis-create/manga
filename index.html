<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>KIN OTΛKU — L’univers manga de Kinshasa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI}
body{background:#f4f1ec;color:#333}

/* HEADER */
header{
background:#ffffff;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 10px rgba(0,0,0,.1);
position:sticky;top:0;z-index:1000
}
header h1{color:#d62828}
nav a{color:#333;margin-left:20px;text-decoration:none;font-weight:500}
nav a:hover{color:#d62828}

/* HERO */
.hero{
height:90vh;
background:
url("https://i.pinimg.com/originals/9b/06/1d/9b061da8b64a381844879769d4824442.jpg") center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
color:#fff;
}

/* Overlay léger pour lisibilité du texte (80% image visible) */
.hero::before{
content:"";
position:absolute;
top:0;left:0;width:100%;height:100%;
background: rgba(255,255,255,0.2); /* 20% blanc, 80% image visible */
z-index:0;
}

.hero > div{position:relative; z-index:1}

.hero h2{font-size:46px;color:#222}
.hero p{margin:20px;font-size:18px;color:#222}
.hero button{
background:#f77f00;border:none;
padding:15px 35px;color:#fff;
border-radius:30px;font-size:16px;cursor:pointer
}

/* SECTION */
section{padding:70px}
h3{text-align:center;color:#d62828;font-size:34px;margin-bottom:40px}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px
}
.product{
background:#fff;border-radius:15px;overflow:hidden;
box-shadow:0 10px 20px rgba(0,0,0,.15)
}
.product img{width:100%;height:320px;object-fit:cover}
.product-content{text-align:center;padding:20px}
.price{color:#e63946;font-weight:bold;margin:10px}
.product button{
margin:5px;border:none;padding:10px 20px;
border-radius:20px;cursor:pointer
}
.add{background:#2a9d8f;color:#fff}
.details{background:#e9c46a}

/* PANIER */
#cart{
position:fixed;right:-360px;top:0;
width:360px;height:100%;
background:#fff;
box-shadow:-5px 0 15px rgba(0,0,0,.3);
padding:20px;
transition:.3s;
z-index:2000
}
#cart h4{text-align:center;margin-bottom:15px;color:#d62828}
.cart-item{margin-bottom:8px;font-size:14px}
#cart button{
width:100%;margin-top:10px;
background:#f77f00;color:#fff;
border:none;padding:10px;border-radius:20px
}
#openCart{
position:fixed;right:20px;bottom:20px;
background:#f77f00;color:#fff;
padding:15px;border-radius:50%;
font-size:18px;cursor:pointer
}

/* MODAL DETAILS */
#modal{
display:none;position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
justify-content:center;align-items:center;z-index:3000
}
.modal-box{
background:#fff;padding:25px;border-radius:15px;
width:380px;max-height:90vh;overflow:auto
}
.modal-box img{width:100%;border-radius:10px;margin-bottom:10px}
.modal-box li{margin-bottom:8px}

/* FOOTER */
footer{
background:#fff;text-align:center;
padding:30px;margin-top:50px;border-top:1px solid #ddd
}
footer span{color:#d62828}
</style>
</head>

<body>

<header>
<h1>📚 KIN OTΛKU</h1>
<nav>
<a href="#">Accueil</a>
<a href="#prod">Mangas & BD</a>
<a href="#">Contact</a>
</nav>
</header>

<div class="hero">
<div>
<h2>Mangas & Bandes Dessinées</h2>
<p>« L’univers manga de Kinshasa »</p>
<button onclick="openCart()">Voir Panier</button>
</div>
</div>

<section id="prod">
<h3>Nos Collections</h3>

<div class="products">

<!-- PRODUITS -->
<script>
const products=[
["Naruto Tome 1",25000,"Naruto"],
["One Piece Tome 1",27000,"One Piece"],
["Dragon Ball Tome 1",26000,"Dragon Ball"],
["Attack on Titan T1",30000,"Attack on Titan"],
["Astérix le Gaulois",22000,"Asterix"],
["Demon Slayer T1",28000,"Demon Slayer"]
]
document.write(products.map(p=>`
<div class="product">
<img src="https://via.placeholder.com/400x600?text=${encodeURIComponent(p[2])}">
<div class="product-content">
<h4>${p[0]}</h4>
<p class="price">${p[1].toLocaleString()} CDF</p>
<button class="add" onclick="addToCart('${p[0]}',${p[1]})">Ajouter</button>
<button class="details" onclick="showDetails(
['https://via.placeholder.com/400x600?text=${encodeURIComponent(p[2])}'],
[
'Titre : ${p[0]}',
'Langue : Français',
'État : Neuf',
'Livraison : 24–48h Kinshasa'
]
)">Détails</button>
</div>
</div>
`).join(""))
</script>

</div>
</section>

<!-- PANIER -->
<div id="cart">
<h4>🛒 Panier</h4>
<div id="cartItems"></div>
<p><strong>Total :</strong> <span id="total">0</span> CDF</p>
<button onclick="orderWhatsApp()">Commander via WhatsApp</button>
<button onclick="closeCart()">Fermer</button>
</div>

<div id="openCart" onclick="openCart()">🛒</div>

<!-- MODAL -->
<div id="modal">
<div class="modal-box">
<div id="modalImages"></div>
<ul id="modalList"></ul>
<button onclick="closeModal()">Fermer</button>
</div>
</div>

<footer>
© 2026 <span>KIN OTΛKU</span> — L’univers manga de Kinshasa
</footer>

<script>
let cart=[],total=0
const cartBox=document.getElementById("cart")
const cartItems=document.getElementById("cartItems")
const totalSpan=document.getElementById("total")
const modal=document.getElementById("modal")
const modalImages=document.getElementById("modalImages")
const modalList=document.getElementById("modalList")

function addToCart(name,price){
cart.push({name,price})
total+=price
updateCart()
openCart()
}
function updateCart(){
cartItems.innerHTML=cart.map(i=>`<div class="cart-item">• ${i.name} - ${i.price} CDF</div>`).join("")
totalSpan.innerText=total
}
function openCart(){cartBox.style.right="0"}
function closeCart(){cartBox.style.right="-360px"}

function showDetails(images,details){
modalImages.innerHTML=images.map(i=>`<img src="${i}">`).join("")
modalList.innerHTML=details.map(d=>`<li>✔ ${d}</li>`).join("")
modal.style.display="flex"
}
function closeModal(){modal.style.display="none"}

function orderWhatsApp(){
let msg="Commande KIN OTΛKU:%0A"
cart.forEach(i=>msg+=`- ${i.name} (${i.price} CDF)%0A`)
msg+=`Total: ${total} CDF`
window.open("https://wa.me/243900000000?text="+msg)
}
</script>

</body>
</html>
